<svg role="img" viewBox="0 0 310 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>TermoPro HVAC</title>
  <!-- Ikona tarczy TermoPro z ciemnoniebieskim tłem -->
  <rect width="72" height="72" rx="18" fill="#0A2540"/>
  
  <!-- Zewnętrzny łuk / celownik chłodzenia (szmaragdowy) -->
  <path d="M36 17V23M36 49V55M17 36H23M49 36H55" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
